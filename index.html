<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111214"><title>REVREN — Start your engine</title><style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f5f4f0;font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:540px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:72px}.brand{font-size:26px;font-weight:900;font-style:italic;letter-spacing:-1px}.brand span{color:#ff673b}button,a{font:inherit}select{background:#222;color:#eee;border:1px solid #444;border-radius:9px;padding:9px}.eyebrow{color:#ff673b;letter-spacing:2px;font-size:11px;font-weight:700}h1{font-size:58px;line-height:1.02;letter-spacing:-3px;margin:19px 0}p{color:#aaaeb7;line-height:1.6}.pill{display:inline-block;padding:7px 11px;border:1px solid #3a3c42;border-radius:20px;font-size:12px;margin:18px 5px 20px 0}.action{display:block;width:100%;border:0;border-radius:14px;padding:17px;background:#ff673b;color:#111;font-weight:750;text-align:center;text-decoration:none;cursor:pointer;margin:12px 0}.secondary{background:#222428;color:#f5f4f0;border:1px solid #36383e}button:disabled{opacity:.5;cursor:wait}.notice{padding:17px;border:1px solid #45342c;border-radius:13px;margin-top:24px;font-size:13px}.steps{padding:0;list-style:none;counter-reset:step}.steps li{counter-increment:step;padding:13px 0;border-bottom:1px solid #2c2e32;color:#c5c7cc;line-height:1.5}.steps li:before{content:'0' counter(step);color:#ff673b;font-size:11px;margin-right:13px}footer{margin-top:45px;font-size:12px;color:#777b83}#error{color:#ffad96}a:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:3px}
</style></head><body><main><header><div class="brand"><span>//</span> REVREN</div><select id="language" aria-label="Language"><option value="en">English</option><option value="cs">Čeština</option></select></header><div class="eyebrow">REVREN / 1.0</div><h1 id="title"></h1><p id="subtitle"></p><span class="pill">Expo SDK 58</span><span class="pill">EN + CS</span><button class="action" id="launch" disabled></button><a class="action secondary" href="preview.html" id="preview"></a><a class="action secondary" href="App.snack.js" download id="source"></a><p id="error" role="alert"></p><div class="notice"><strong id="noteTitle"></strong><p id="noteBody"></p></div><ol class="steps"><li id="step1"></li><li id="step2"></li><li id="step3"></li></ol><footer id="footer"></footer></main><script>
const text={en:{title:'Start your<br>engine.',subtitle:'Your garage. Your meets. Your crew. Open REVREN in Expo Snack, then test on your phone.',launch:'Open REVREN in Snack ↗',preview:'Try the browser preview',source:'Download App.snack.js',noteTitle:'SDK 58 is required',noteBody:'This launcher requests SDK 58. If Snack changes it to an older version, stop: that session is not compatible with this project. The launcher cannot add support to Snack.',step1:'Open the project in Snack.',step2:'Verify Expo v58.0.0 and wait for dependencies to load.',step3:'Choose My Device / Run on device and open the QR in Expo Go.',footer:'Local-first release. Accounts and live group chat are not connected. Photos and translations are included in the source.',error:'Could not load the launcher configuration. Open this page through GitHub Pages and try again.'},cs:{title:'Nastartuj<br>svůj svět.',subtitle:'Tvoje garáž. Tvoje srazy. Tvoje crew. Otevři REVREN v Expo Snack a vyzkoušej ho na telefonu.',launch:'Otevřít REVREN ve Snacku ↗',preview:'Vyzkoušet náhled v prohlížeči',source:'Stáhnout App.snack.js',noteTitle:'Vyžaduje SDK 58',noteBody:'Spouštěč požaduje SDK 58. Pokud ho Snack změní na starší verzi, nepokračuj: taková relace není s projektem kompatibilní. Spouštěč neumí přidat podporu do Snacku.',step1:'Otevři projekt ve Snacku.',step2:'Ověř Expo v58.0.0 a počkej na načtení závislostí.',step3:'Zvol My Device / Run on device a otevři QR v Expo Go.',footer:'Lokální verze. Účty a živý skupinový chat zatím nejsou připojené. Fotky a překlady jsou přímo ve zdrojovém souboru.',error:'Konfiguraci se nepodařilo načíst. Otevři tuto stránku přes GitHub Pages a zkus to znovu.'}};
let lang='en',config,failed=false;function render(){for(const [id,value]of Object.entries(text[lang])){if(id==='error')continue;const el=document.getElementById(id);if(id==='title')el.innerHTML=value;else el.textContent=value}document.documentElement.lang=lang;document.getElementById('error').textContent=failed?text[lang].error:''}render();document.getElementById('language').onchange=e=>{lang=e.target.value;render()};fetch('./snack-config.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{config=c;document.getElementById('launch').disabled=false}).catch(()=>{failed=true;render()});document.getElementById('launch').onclick=()=>{if(!config)return;const source=new URL('App.snack.js',location.href);if(!['http:','https:'].includes(source.protocol)){failed=true;render();return}const params=new URLSearchParams({name:config.name,description:'REVREN — Garage, meets and crews. English + Czech.',sdkVersion:config.sdkVersion,sourceUrl:source.href,dependencies:Object.entries(config.dependencies).map(([n,v])=>n+'@'+v).join(','),platform:'mydevice',theme:'dark'});location.assign('https://snack.expo.dev/?'+params.toString())};
</script></body></html>
